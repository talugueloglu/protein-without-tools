[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fable_bench"]

[project]
name = "fable-protein-bench"
version = "0.1.0"
description = "Protein Structure Without Tools: 8-Task Structural Biology Benchmark for Frontier Reasoning Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
cloud = [
    "modal>=0.64.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.8.0",
]
dev = [
    "pytest>=8.0.0",
]


